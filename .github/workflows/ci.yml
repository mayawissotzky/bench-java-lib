name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build summary
        if: github.event_name == 'pull_request'
        run: |
          echo "### ${{ github.event.pull_request.title }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Head: ${{ github.event.pull_request.head.sha }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Test
        run: mvn -B -ntp verify -Dgpg.skip
